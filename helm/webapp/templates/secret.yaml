{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webapp.secretName" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secret.key }}: {{ required "secret.value is required when secret.create=true" .Values.secret.value | b64enc | quote }}
{{- end }}

